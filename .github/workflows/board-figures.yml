name: Board figures (drift check)

# Regenerates the board figures in a KiCad container and compares them with the
# ones committed to the repository. It publishes nothing and commits nothing.
#
# Why it exists: the figures are generated on a workstation and committed,
# because the workflow that publishes the site has no KiCad. That is fine until
# something underneath moves -- a KiCad release changing how a board is drawn,
# an appearance default shifting, a model that stops resolving. None of that
# announces itself, and the hash stamps cannot see it: they only know whether a
# figure is older than its design, not whether redrawing it today would produce
# the same picture.
#
# So this runs weekly and says whether the two still agree. A failure is not
# necessarily a problem with the repository -- it may be the container that
# moved -- but it is always worth knowing.
#
# It is NOT the generator. Moving generation here was considered and rejected:
# a trial showed the container and the workstation disagreeing about which 3D
# models to draw, and the staleness guard already covers the problem that moving
# would have solved.

on:
  schedule:
    # Weekly, early Monday. Not on push: the image pull and toolchain install
    # cost minutes whether or not anything changed, and a full regeneration is
    # about 17 minutes.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      image:
        description: "KiCad container image"
        default: "kicad/kicad:10.0"
        required: true
      scope:
        description: "What to generate"
        type: choice
        options: [all, stale]
        default: all
        required: true

permissions:
  contents: read

jobs:
  figures:
    name: Generate in a container
    runs-on: ubuntu-latest

    container:
      image: ${{ inputs.image }}
      # kicad images run as a non-root user with a home the runner does not
      # own; root avoids a pile of permission failures that have nothing to do
      # with what is being tested.
      options: --user root

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Let git look at the checkout
        # The container runs as root over a checkout the runner owns, which
        # git rejects as dubious ownership.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Tolerant on purpose: this step reports what the image has, and a
      # missing tool is an answer rather than a reason to stop here.
      - name: Report the environment
        run: |
          (kicad-cli version || kicad-cli --version) 2>/dev/null || echo "kicad-cli: ABSENT"
          python3 --version 2>/dev/null || echo "python3: ABSENT"
          python3 -m pip --version 2>/dev/null || echo "pip: absent"
          cmake --version 2>/dev/null | head -1 || echo "cmake: absent"
          echo "fonts visible: $(fc-list 2>/dev/null | wc -l)"

      # The kicad images carry KiCad and its runtime, not a build toolchain, so
      # cmake is usually missing. It is only needed to drive the same rules the
      # workstation uses -- duplicating them in a script here would be a second
      # source of truth and would drift.
      - name: Install build prerequisites
        run: |
          need=""
          command -v cmake >/dev/null || need="$need cmake"
          command -v make  >/dev/null || need="$need make"
          command -v pdftotext >/dev/null || need="$need poppler-utils"
          python3 -m pip --version >/dev/null 2>&1 || need="$need python3-pip"
          if [ -n "$need" ]; then
            echo "installing:$need"
            apt-get update -qq && apt-get install -y -qq $need
          else
            echo "nothing to install"
          fi
          cmake --version | head -1

      # Pure Python, no KiCad. kicad-cli draws a model it cannot find as
      # nothing and still reports success, so without this a container missing
      # a model publishes a part-empty board with a green tick.
      - name: Check every 3D model resolves
        run: python3 BoardDesigns/kicad-helpers/check_models.py

      - name: Install Pillow for the trim step
        # The flag is required on a PEP 668 image and rejected by older pip,
        # so try it and fall back rather than guessing which this image is.
        run: |
          python3 -c "import PIL" 2>/dev/null && { echo "already present"; exit 0; }
          python3 -m pip install --break-system-packages Pillow \
            || python3 -m pip install Pillow \
            || { apt-get update && apt-get install -y python3-pil; }
          python3 -c "import PIL, sys; print('Pillow', PIL.__version__)"

      - name: Configure
        run: cmake -S BoardDesigns -B build-boards

      # A clone does not preserve mtimes, so CMake would consider every board
      # out of date and redraw all nineteen. The stamps are content hashes, so
      # they survive a clone and say which boards actually changed.
      - name: Work out what needs generating
        id: select
        run: |
          if [ "${{ inputs.scope }}" = "all" ]; then
            targets=board-docs
          else
            targets=$(python3 BoardDesigns/kicad-helpers/check_renders.py --stale-targets | tr '\n' ' ')
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          if [ -z "$targets" ]; then
            echo "::warning::Every figure is current, so nothing was"\
                 " generated and this run has not compared anything."\
                 " Re-run with scope: all to actually exercise the container."
          else
            echo "Generating: $targets"
          fi

      # cmake writes the figures into the working tree, on top of the committed
      # ones, so the thing being compared against has to be put aside first.
      - name: Put the committed figures aside
        if: steps.select.outputs.targets != '''
        run: |
          mkdir -p _committed/docs/src
          cp -a docs/src/images   _committed/docs/src/
          cp -a docs/src/schematics _committed/docs/src/
          echo "kept $(find _committed -type f | wc -l) committed figures"

      - name: Generate
        if: steps.select.outputs.targets != ''
        run: cmake --build build-boards --target ${{ steps.select.outputs.targets }}

      # The comparison proper. Byte equality means nothing here -- the renders
      # are raytraced and two runs on one machine already differ -- so this
      # reports trimmed image dimensions, which track what was actually drawn,
      # a noise-tolerant pixel difference, and the schematic PDFs' text word
      # for word.
      - name: Compare with the committed figures
        if: steps.select.outputs.targets != ''
        run: |
          python3 BoardDesigns/kicad-helpers/compare_figures.py . \
            --repo _committed | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload what the container produced
        if: steps.select.outputs.targets != ''
        uses: actions/upload-artifact@v4
        with:
          name: board-figures
          path: |
            docs/src/images/boards/
            docs/src/schematics/
            BoardDesigns/.render-stamps/
          if-no-files-found: error
