name: External link check

# The documentation build fails on a broken internal link, but says nothing
# about the links that leave the site -- among them the URLs pointing at the
# project umbrella and the software documentation.
#
# This runs weekly and never on a push or a pull request: an external link
# breaks for reasons outside this repository, so a dead one is news rather
# than a reason to block a merge.

on:
  schedule:
    - cron: "51 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  link-check:
    name: Check external links
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        # The link check reads docs/ only; the STM32 pin-data submodule is
        # not needed and is large.
        with:
          submodules: false

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # The published documentation only. Board design reviews under
          # BoardDesigns/ and the KiCad skill references under .agents/ are
          # internal and left out.
          #
          # 429 is accepted because a rate-limited host has told us nothing
          # about the link.
          args: >-
            --no-progress
            --scheme http
            --scheme https
            --accept 200..=204,206,429
            --max-retries 2
            --timeout 20
            --exclude-mail
            --exclude-all-private
            docs/mkdocs.yml
            'docs/**/*.md'
          output: lychee-report.md
          fail: true

      - name: Publish the report in the run summary
        if: always() && hashFiles('lychee-report.md') != ''
        run: cat lychee-report.md >> "$GITHUB_STEP_SUMMARY"
