site_name: "Ultralight Tags: Hardware"
site_description: Board designs, mechanical designs and tag assembly for the ultralight tag project.
site_author: Indiana University
# Served as a project site under the organization site at the domain root.
# Without this, MkDocs writes a sitemap with no entries and no canonical
# link tags, so search engines are handed nothing to crawl.
site_url: https://tag-designs.github.io/hardware/

docs_dir: src
site_dir: site
use_directory_urls: false

theme:
  name: material
  icon:
    logo: material/chip
  features:
    # navigation.sections is deliberately absent: it renders each top-level
    # group as a flat header, so sub-pages get no indentation and the side
    # index reads as one long list. Without it, sections nest and indent.
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

# Material fingerprints its own stylesheet filenames, so a theme update reaches
# readers immediately. Files listed here are referenced by plain path and are
# cached hard by browsers and by the Pages CDN, so a change to extra.css can go
# unseen behind a stale copy. The query string is the version: bump it whenever
# extra.css changes in a way readers need to see.
extra_css:
  - stylesheets/extra.css?v=2

nav:
  - Hardware Home: index.md
  # The umbrella site at the organization root carries the project overview,
  # the tag families and the cross-cutting field guides.
  - Project Home: https://tag-designs.github.io/
  - Board Designs: boards/index.md
  - Tag Designs:
    - Overview: tags/index.md
    - BitTagv7: tags/bittag.md
    - BitTagNG: tags/bittagng.md
    - PresTag: tags/prestag.md
    - CompassTag: tags/compasstag.md
    - UIUC Tag: tags/uiuctag.md
    - IMUTag: tags/imutag.md
  - Mechanical Designs: mechanical/index.md
  - Board Assembly: assembly/index.md
